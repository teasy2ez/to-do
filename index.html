<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal to-do</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: #020617;
      color: #34d399;
    }

    /* Terminal Phosphor Glow */
    .glow-text {
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.6), 0 0 16px rgba(16, 185, 129, 0.3);
    }
    
    .glow-box {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
    }

    /* CRT Scanline Overlay Effect */
    .crt-overlay {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen p-6 antialiased selection:bg-emerald-900 selection:text-emerald-100 relative">
  <div class="fixed inset-0 crt-overlay z-50 pointer-events-none"></div>

  <div class="max-w-2xl mx-auto py-10 relative z-10">
    
    <div id="auth-screen" class="space-y-8">
      <header class="border-b border-emerald-700/80 pb-5">
        <h1 class="text-lg font-bold tracking-widest text-emerald-300 glow-text">> terminal_auth.exe</h1>
      </header>
      
      <div class="space-y-5 max-w-md">
        <div class="space-y-2">
          <label class="text-base font-semibold text-emerald-400">email:</label>
          <input id="auth-email" type="email" placeholder="user@terminal.com" class="w-full bg-black border-2 border-emerald-700 rounded-md px-4 py-2.5 text-base text-emerald-200 placeholder-emerald-800 focus:outline-none focus:border-emerald-400 glow-box"/>
        </div>
        
        <div class="space-y-2">
          <label class="text-base font-semibold text-emerald-400">password:</label>
          <input id="auth-pass" type="password" placeholder="••••••••" class="w-full bg-black border-2 border-emerald-700 rounded-md px-4 py-2.5 text-base text-emerald-200 placeholder-emerald-800 focus:outline-none focus:border-emerald-400 glow-box"/>
        </div>

        <div class="flex gap-4 pt-2">
          <button onclick="login()" class="text-base bg-emerald-950 text-emerald-300 border-2 border-emerald-600 px-5 py-2 rounded-md hover:bg-emerald-900 font-bold glow-text">[login]</button>
          <button onclick="signup()" class="text-base text-emerald-400 hover:text-emerald-200 px-3 py-2 font-semibold">[sign up]</button>
        </div>
        <p id="auth-msg" class="text-base text-amber-400 italic min-h-[1.25rem]"></p>
      </div>
    </div>

    <div id="app-screen" class="hidden space-y-8">
      <header class="border-b-2 border-emerald-700/80 pb-5 flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold tracking-widest text-emerald-300 glow-text">> task_manager.exe</h1>
          <span id="user-display" class="text-xs text-emerald-400/90 font-medium">user: --</span>
        </div>
        <div class="flex items-center gap-5">
          <span id="sync-status" class="text-xs text-emerald-400 font-bold">synced</span>
          <button onclick="logout()" class="text-base text-emerald-400 hover:text-emerald-100 font-bold">[logout]</button>
        </div>
      </header>

      <div class="space-y-3">
        <div class="flex gap-5 text-base mb-2">
          <button id="btn-now" onclick="setTarget('now')" class="text-emerald-300 font-bold underline glow-text">+ add to now</button>
          <button id="btn-later" onclick="setTarget('later')" class="text-emerald-500 hover:text-emerald-200 font-semibold">+ add to later</button>
        </div>
        <div class="flex items-center gap-3 bg-black border-2 border-emerald-700 rounded-md px-4 py-3 focus-within:border-emerald-400 glow-box">
          <span class="text-base text-emerald-400 font-bold glow-text">></span>
          <input
            id="task-input"
            type="text"
            placeholder="add task to now..."
            class="w-full bg-transparent text-base text-emerald-100 placeholder-emerald-700 focus:outline-none font-medium"
            onkeydown="if(event.key === 'Enter') addTask()"
          />
        </div>
      </div>

      <section>
        <h2 class="text-base text-emerald-400 font-bold tracking-wider mb-3 glow-text">// now</h2>
        <div id="list-now" class="space-y-2 min-h-[44px]" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'now')"></div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3 border-t-2 border-emerald-900/80 pt-6">
          <h2 class="text-base text-emerald-400 font-bold tracking-wider glow-text">// later</h2>
          <button id="btn-toggle-later" onclick="toggleLater()" class="text-xs text-emerald-500 hover:text-emerald-300 font-semibold">[-] minimize</button>
        </div>
        <div id="list-later" class="space-y-2 min-h-[44px]" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'later')"></div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3 border-t-2 border-emerald-900/80 pt-6">
          <h2 class="text-base text-emerald-500 font-bold tracking-wider">// completed</h2>
          <button id="btn-toggle-completed" onclick="toggleCompleted()" class="text-xs text-emerald-500 hover:text-emerald-300 font-semibold">[-] minimize</button>
        </div>
        <div id="list-completed" class="space-y-2 min-h-[44px]"></div>
      </section>

      <footer class="mt-12 text-xs text-emerald-400/80 border-t-2 border-emerald-900/80 pt-5 flex justify-between font-medium">
        <span>status: authenticated</span>
        <span id="pending-count">0 pending tasks</span>
      </footer>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAAN10JXtcd4-ikgXCZxABGPYBRfDH5C5g",
      authDomain: "to-do-t.firebaseapp.com",
      projectId: "to-do-t",
      storageBucket: "to-do-t.firebasestorage.app",
      messagingSenderId: "862859632310",
      appId: "1:862859632310:web:6ad0e655b25878b3025017"
        
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let unsubscribeSync = null;
    let targetList = 'now';
    let laterMinimized = false;
    let completedMinimized = false;
    let draggedId = null;
    let todos = [];

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display').innerText = `user: ${user.email}`;
        initSync();
      } else {
        currentUser = null;
        if (unsubscribeSync) unsubscribeSync();
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
      }
    });

    async function login() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      const msg = document.getElementById('auth-msg');
      msg.innerText = '';
      
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
        msg.innerText = `[error]: ${err.message.toLowerCase()}`;
      }
    }

    async function signup() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      const msg = document.getElementById('auth-msg');
      msg.innerText = '';

      try {
        await auth.createUserWithEmailAndPassword(email, pass);
      } catch (err) {
        msg.innerText = `[error]: ${err.message.toLowerCase()}`;
      }
    }

    function logout() {
      auth.signOut();
    }

    function getUserTasksRef() {
      return db.collection('users').doc(currentUser.uid).collection('tasks');
    }

    function initSync() {
      updateSyncStatus('connecting...');
      unsubscribeSync = getUserTasksRef().onSnapshot((snapshot) => {
        todos = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        todos.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
        updateSyncStatus('synced');
        render();
      }, (error) => {
        console.error(error);
        updateSyncStatus('sync error');
      });
    }

    function formatDate(val) {
      if (!val) return '';
      let date = val.toDate ? val.toDate() : new Date(val);
      if (isNaN(date.getTime())) return '';

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day} - ${hours}:${minutes}`;
    }

    function updateSyncStatus(msg) {
      document.getElementById('sync-status').innerText = msg;
    }

    function setTarget(list) {
      targetList = list;
      document.getElementById('task-input').placeholder = `add task to ${list}...`;
      document.getElementById('btn-now').className = list === 'now' ? 'text-emerald-300 font-bold underline glow-text' : 'text-emerald-500 hover:text-emerald-300 font-semibold';
      document.getElementById('btn-later').className = list === 'later' ? 'text-emerald-300 font-bold underline glow-text' : 'text-emerald-500 hover:text-emerald-300 font-semibold';
    }

    async function addTask() {
      const input = document.getElementById('task-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;

      const taskId = Date.now().toString();
      const newTask = {
        text: val,
        completed: false,
        list: targetList,
        previousList: targetList,
        createdAt: new Date().toISOString(),
        completedAt: null
      };

      input.value = '';
      updateSyncStatus('saving...');
      await getUserTasksRef().doc(taskId).set(newTask);
    }

    async function toggleTask(id) {
      const task = todos.find(t => t.id === id);
      if (!task) return;

      const isCompleting = !task.completed;
      updateSyncStatus('updating...');

      const updates = {
        completed: isCompleting,
        completedAt: isCompleting ? new Date().toISOString() : null
      };

      if (isCompleting) {
        updates.previousList = task.list;
      } else if (task.previousList) {
        updates.list = task.previousList;
      }

      await getUserTasksRef().doc(id).update(updates);
    }

    async function deleteTask(id) {
      updateSyncStatus('deleting...');
      await getUserTasksRef().doc(id).delete();
    }

    function toggleLater() {
      laterMinimized = !laterMinimized;
      document.getElementById('btn-toggle-later').innerText = laterMinimized ? '[+] expand' : '[-] minimize';
      render();
    }

    function toggleCompleted() {
      completedMinimized = !completedMinimized;
      document.getElementById('btn-toggle-completed').innerText = completedMinimized ? '[+] expand' : '[-] minimize';
      render();
    }

    function handleDragStart(e, id) {
      draggedId = id;
      e.dataTransfer.setData('text/plain', id);
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    async function handleDrop(e, targetSection) {
      e.preventDefault();
      if (!draggedId) return;

      const task = todos.find(t => t.id === draggedId);
      if (!task || task.completed || task.list === targetSection) return;

      const idToUpdate = draggedId;
      draggedId = null;

      updateSyncStatus('updating...');
      await getUserTasksRef().doc(idToUpdate).update({
        list: targetSection,
        previousList: targetSection
      });
    }

    function render() {
      const nowContainer = document.getElementById('list-now');
      const laterContainer = document.getElementById('list-later');
      const completedContainer = document.getElementById('list-completed');

      nowContainer.innerHTML = '';
      laterContainer.innerHTML = '';
      completedContainer.innerHTML = '';

      const activeTodos = todos.filter(t => !t.completed);
      const nowItems = activeTodos.filter(t => t.list === 'now');
      const laterItems = activeTodos.filter(t => t.list === 'later');
      const completedItems = todos.filter(t => t.completed);

      if (nowItems.length === 0) {
        nowContainer.innerHTML = '<p class="text-base text-emerald-600/70 italic py-1">> empty</p>';
      } else {
        nowItems.forEach(t => nowContainer.appendChild(createTaskElement(t)));
      }

      if (laterMinimized) {
        laterContainer.innerHTML = '';
      } else if (laterItems.length === 0) {
        laterContainer.innerHTML = '<p class="text-base text-emerald-600/70 italic py-1">> empty</p>';
      } else {
        laterItems.forEach(t => laterContainer.appendChild(createTaskElement(t)));
      }

      if (completedMinimized) {
        completedContainer.innerHTML = '';
      } else if (completedItems.length === 0) {
        completedContainer.innerHTML = '<p class="text-base text-emerald-600/70 italic py-1">> empty</p>';
      } else {
        completedItems.forEach(t => completedContainer.appendChild(createTaskElement(t)));
      }

      document.getElementById('pending-count').innerText = `${activeTodos.length} pending tasks`;
    }

    function createTaskElement(todo) {
      const div = document.createElement('div');
      
      if (!todo.completed) {
        div.draggable = true;
        div.ondragstart = (e) => handleDragStart(e, todo.id);
      }

      div.className = `group flex flex-col p-3 rounded-md border-2 border-emerald-800/70 bg-emerald-950/20 hover:border-emerald-500 transition-colors ${
        todo.completed ? 'opacity-50 border-emerald-900/40 bg-transparent' : 'cursor-grab active:cursor-grabbing'
      }`;

      const createdStr = formatDate(todo.createdAt);
      const completedStr = formatDate(todo.completedAt);

      div.innerHTML = `
        <div class="flex items-center justify-between min-w-0">
          <div class="flex items-center gap-3.5 min-w-0">
            <span class="text-emerald-400 select-none text-base font-bold">${todo.completed ? '•' : '⋮⋮'}</span>
            <button onclick="toggleTask('${todo.id}')" class="text-base font-bold text-emerald-300 hover:text-emerald-100 glow-text">
              ${todo.completed ? '[x]' : '[ ]'}
            </button>
            <span class="text-base font-medium ${todo.completed ? 'line-through text-emerald-600' : 'text-emerald-100'}">
              ${todo.text}
            </span>
          </div>
          <button onclick="deleteTask('${todo.id}')" class="text-emerald-400 hover:text-rose-400 font-bold text-base opacity-0 group-hover:opacity-100 transition-opacity px-1">
            [del]
          </button>
        </div>
        
        <div class="mt-2 pl-8 flex gap-5 text-xs text-emerald-400/80 select-none">
          ${createdStr ? `<span>created: ${createdStr}</span>` : ''}
          ${todo.completed && completedStr ? `<span>completed: ${completedStr}</span>` : ''}
        </div>
      `;

      return div;
    }
  </script>
</body>
</html>
