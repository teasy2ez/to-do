<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>terminal to-do</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: #000;
      color: #10b981;
    }
  </style>
</head>
<body class="min-h-screen p-6 antialiased selection:bg-emerald-950 selection:text-emerald-300">
  <div class="max-w-xl mx-auto py-12">
    <!-- Header -->
    <header class="mb-8 border-b border-emerald-900/60 pb-4 flex justify-between items-center">
      <h1 class="text-sm font-bold tracking-widest text-emerald-500">> task_manager.exe</h1>
      <span id="sync-status" class="text-[10px] text-emerald-700">connecting firebase...</span>
    </header>

    <!-- Input Area -->
    <div class="mb-8 space-y-2">
      <div class="flex gap-4 text-xs mb-2">
        <button id="btn-now" onclick="setTarget('now')" class="text-emerald-400 font-bold underline">+ add to now</button>
        <button id="btn-later" onclick="setTarget('later')" class="text-emerald-700 hover:text-emerald-300">+ add to later</button>
      </div>
      <div class="flex items-center gap-2 bg-black border border-emerald-900 rounded px-3 py-2 focus-within:border-emerald-500">
        <span class="text-xs text-emerald-600">></span>
        <input
          id="task-input"
          type="text"
          placeholder="add task to now..."
          class="w-full bg-transparent text-xs text-emerald-400 placeholder-emerald-800 focus:outline-none"
          onkeydown="if(event.key === 'Enter') addTask()"
        />
      </div>
    </div>

    <!-- Section: Now -->
    <section class="mb-8">
      <h2 class="text-xs text-emerald-600 uppercase tracking-wider mb-3">// now</h2>
      <div id="list-now" class="space-y-1.5 min-h-[40px]" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'now')"></div>
    </section>

    <!-- Section: Later -->
    <section class="mb-8">
      <div class="flex items-center justify-between mb-3 border-t border-emerald-950 pt-6">
        <h2 class="text-xs text-emerald-600 uppercase tracking-wider">// later</h2>
        <button id="btn-toggle-later" onclick="toggleLater()" class="text-xs text-emerald-700 hover:text-emerald-400">[-] minimize</button>
      </div>
      <div id="list-later" class="space-y-1.5 min-h-[40px]" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'later')"></div>
    </section>

    <!-- Section: Completed -->
    <section>
      <div class="flex items-center justify-between mb-3 border-t border-emerald-950 pt-6">
        <h2 class="text-xs text-emerald-800 uppercase tracking-wider">// completed</h2>
        <button id="btn-toggle-completed" onclick="toggleCompleted()" class="text-xs text-emerald-800 hover:text-emerald-600">[-] minimize</button>
      </div>
      <div id="list-completed" class="space-y-1.5 min-h-[40px]"></div>
    </section>

    <!-- Footer -->
    <footer class="mt-12 text-[10px] text-emerald-800 border-t border-emerald-950 pt-4 flex justify-between">
      <span>status: firebase active</span>
      <span id="pending-count">0 pending tasks</span>
    </footer>
  </div>

  <script>
    // --- PASTE YOUR FIREBASE CONFIG HERE ---
    const firebaseConfig = {
      apiKey: "AIzaSyAAN10JXtcd4-ikgXCZxABGPYBRfDH5C5g",
      authDomain: "to-do-t.firebaseapp.com",
      projectId: "to-do-t",
      storageBucket: "to-do-t.firebasestorage.app",
      messagingSenderId: "862859632310",
      appId: "1:862859632310:web:6ad0e655b25878b3025017"
};
    // ----------------------------------------

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let targetList = 'now';
    let laterMinimized = false;
    let completedMinimized = false;
    let draggedId = null;
    let todos = [];

    // Helper function to format dates as YYYY/MM/DD - HH:MM
    function formatDate(dateObj) {
      if (!dateObj) return '';
      const date = dateObj.toDate ? dateObj.toDate() : new Date(dateObj);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day} - ${hours}:${minutes}`;
    }

    function initRealtimeSync() {
      db.collection("tasks").orderBy("createdAt", "asc")
        .onSnapshot((snapshot) => {
          todos = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          updateSyncStatus('synced');
          render();
        }, (error) => {
          console.error("Firestore error:", error);
          updateSyncStatus('sync error');
        });
    }

    function updateSyncStatus(msg) {
      document.getElementById('sync-status').innerText = msg;
    }

    function setTarget(list) {
      targetList = list;
      document.getElementById('task-input').placeholder = `add task to ${list}...`;
      document.getElementById('btn-now').className = list === 'now' ? 'text-emerald-400 font-bold underline' : 'text-emerald-700 hover:text-emerald-300';
      document.getElementById('btn-later').className = list === 'later' ? 'text-emerald-400 font-bold underline' : 'text-emerald-700 hover:text-emerald-300';
    }

    async function addTask() {
      const input = document.getElementById('task-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;

      const taskId = Date.now().toString();
      const newTask = {
        text: val,
        completed: false,
        list: targetList,
        previousList: targetList,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        completedAt: null
      };

      input.value = '';
      updateSyncStatus('saving...');
      
      try {
        await db.collection("tasks").doc(taskId).set(newTask);
      } catch (err) {
        console.error("Error adding task:", err);
      }
    }

    async function toggleTask(id) {
      const task = todos.find(t => t.id === id);
      if (!task) return;

      const isCompleting = !task.completed;
      updateSyncStatus('updating...');

      const updateData = {
        completed: isCompleting,
        completedAt: isCompleting ? firebase.firestore.FieldValue.serverTimestamp() : null
      };

      // Store previous list when completing, restore list when unchecking
      if (isCompleting) {
        updateData.previousList = task.list;
      } else if (task.previousList) {
        updateData.list = task.previousList;
      }

      try {
        await db.collection("tasks").doc(id).update(updateData);
      } catch (err) {
        console.error("Error toggling task:", err);
      }
    }

    async function deleteTask(id) {
      updateSyncStatus('deleting...');
      try {
        await db.collection("tasks").doc(id).delete();
      } catch (err) {
        console.error("Error deleting task:", err);
      }
    }

    function toggleLater() {
      laterMinimized = !laterMinimized;
      document.getElementById('btn-toggle-later').innerText = laterMinimized ? '[+] expand' : '[-] minimize';
      render();
    }

    function toggleCompleted() {
      completedMinimized = !completedMinimized;
      document.getElementById('btn-toggle-completed').innerText = completedMinimized ? '[+] expand' : '[-] minimize';
      render();
    }

    // Drag and Drop
    function handleDragStart(e, id) {
      draggedId = id;
      e.dataTransfer.setData('text/plain', id);
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    async function handleDrop(e, targetSection) {
      e.preventDefault();
      if (!draggedId) return;

      const task = todos.find(t => t.id === draggedId);
      if (!task || task.completed || task.list === targetSection) return;

      updateSyncStatus('updating...');
      const idToUpdate = draggedId;
      draggedId = null;

      try {
        await db.collection("tasks").doc(idToUpdate).update({
          list: targetSection,
          previousList: targetSection
        });
      } catch (err) {
        console.error("Error moving task:", err);
      }
    }

    function render() {
      const nowContainer = document.getElementById('list-now');
      const laterContainer = document.getElementById('list-later');
      const completedContainer = document.getElementById('list-completed');

      nowContainer.innerHTML = '';
      laterContainer.innerHTML = '';
      completedContainer.innerHTML = '';

      const activeTodos = todos.filter(t => !t.completed);
      const nowItems = activeTodos.filter(t => t.list === 'now');
      const laterItems = activeTodos.filter(t => t.list === 'later');
      const completedItems = todos.filter(t => t.completed);

      // Render Now
      if (nowItems.length === 0) {
        nowContainer.innerHTML = '<p class="text-xs text-emerald-900 italic py-1">> empty</p>';
      } else {
        nowItems.forEach(t => nowContainer.appendChild(createTaskElement(t)));
      }

      // Render Later
      if (laterMinimized) {
        laterContainer.innerHTML = '';
      } else if (laterItems.length === 0) {
        laterContainer.innerHTML = '<p class="text-xs text-emerald-900 italic py-1">> empty</p>';
      } else {
        laterItems.forEach(t => laterContainer.appendChild(createTaskElement(t)));
      }

      // Render Completed
      if (completedMinimized) {
        completedContainer.innerHTML = '';
      } else if (completedItems.length === 0) {
        completedContainer.innerHTML = '<p class="text-xs text-emerald-900 italic py-1">> empty</p>';
      } else {
        completedItems.forEach(t => completedContainer.appendChild(createTaskElement(t)));
      }

      document.getElementById('pending-count').innerText = `${activeTodos.length} pending tasks`;
    }

    function createTaskElement(todo) {
      const div = document.createElement('div');
      
      // Only allow drag if task is active
      if (!todo.completed) {
        div.draggable = true;
        div.ondragstart = (e) => handleDragStart(e, todo.id);
      }

      div.className = `group flex flex-col p-2 rounded border border-emerald-900/60 bg-black hover:border-emerald-500/50 transition-colors ${
        todo.completed ? 'opacity-40 border-emerald-950' : 'cursor-grab active:cursor-grabbing'
      }`;

      const createdStr = formatDate(todo.createdAt);
      const completedStr = formatDate(todo.completedAt);

      div.innerHTML = `
        <div class="flex items-center justify-between min-w-0">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-emerald-900 select-none text-xs">${todo.completed ? '•' : '⋮⋮'}</span>
            <button onclick="toggleTask('${todo.id}')" class="text-xs hover:text-emerald-300">
              ${todo.completed ? '[x]' : '[ ]'}
            </button>
            <span class="text-xs ${todo.completed ? 'line-through text-emerald-700' : 'text-emerald-400'}">
              ${todo.text}
            </span>
          </div>
          <button onclick="deleteTask('${todo.id}')" class="text-emerald-800 hover:text-emerald-400 text-xs opacity-0 group-hover:opacity-100 transition-opacity px-1">
            [del]
          </button>
        </div>
        
        <!-- Timestamps -->
        <div class="mt-1 pl-7 flex gap-4 text-[9px] text-emerald-900 select-none">
          ${createdStr ? `<span>created: ${createdStr}</span>` : ''}
          ${todo.completed && completedStr ? `<span>completed: ${completedStr}</span>` : ''}
        </div>
      `;

      return div;
    }

    initRealtimeSync();
  </script>
</body>
</html>
